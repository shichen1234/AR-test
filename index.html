<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>药盒 WebAR 图片追踪 Demo</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  #camera,#overlay{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #camera{z-index:0;background:#111}
  #overlay{z-index:1;pointer-events:none}
  #ui{position:fixed;z-index:5;left:16px;right:16px;top:max(16px,env(safe-area-inset-top));color:#fff}
  .panel{background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-radius:16px;padding:12px 14px}
  #status{font-size:15px;font-weight:600}
  #hint{font-size:12px;opacity:.82;margin-top:5px;line-height:1.45}
  button{margin-top:10px;border:0;border-radius:999px;padding:10px 16px;background:#fff;color:#111;font-weight:700}
  #targetPreview{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;width:92px;border-radius:10px;opacity:.8;border:1px solid rgba(255,255,255,.5);display:none}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<div id="ui">
  <div class="panel">
    <div id="status">正在加载视觉追踪引擎…</div>
    <div id="hint">允许摄像头后，把药盒顶部完整放进画面。图片会立在药盒中线上，跟着药盒移动/旋转/远近变化。</div>
    <button id="start">启动摄像头</button>
  </div>
</div>
<img id="targetPreview" src="target.jpg">

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const startBtn = document.getElementById('start');
const targetPreview = document.getElementById('targetPreview');

const targetImg = new Image();
const arImg = new Image();
targetImg.src = 'target.jpg';
arImg.src = 'ar-content.jpg';

let orb, targetGray, targetKp, targetDesc, matcher;
let srcCornersMat = null;   // 4 corners of target.jpg in its own pixel space
let arFullMat = null;       // ar-content.jpg at its native resolution (no squish)
let arCornersMat = null;    // 4 corners of ar-content.jpg in its own pixel space
let targetW = 0, targetH = 0;
let billboardW = 0, billboardH = 0;

let running = false;

// ---- how the image is displayed ----
// 'vertical' = stands up perpendicular to the box, anchored along the
//              box's centerline (what you asked for).
// 'flat'     = old behaviour, pasted flat onto the box's own surface.
const DISPLAY_MODE = 'vertical';
// If the billboard renders upside-down or appears to grow into the box
// instead of up out of it, flip this to 1.
const BILLBOARD_UP = -1;

// ---- stability state ----
// We still smooth the tracked quad frame-to-frame and briefly bridge over
// missed detections, so the pose doesn't jump/flicker — but responsiveness
// is turned up from the last version since the delay was the complaint
// this time.
let smoothCorners = null;  // Array(8): x0,y0,x1,y1,x2,y2,x3,y3 — target quad in frame space
let lastSeenAt = 0;
const HOLD_MS = 400;       // bridge briefly-missed frames for up to this long
const SMOOTH = 0.55;       // 0..1 — higher = snappier/less laggy, lower = smoother/laggier

// ---- rough camera model (no real calibration available) ----
// fx=fy=frame width in pixels is a common stand-in for phone cameras when
// you don't have a proper calibration; cx/cy is the frame center.
let fx=0, fy=0, cx=0, cy=0, Kinv=null;
function updateIntrinsics(){
  fx = canvas.width || 1; fy = fx;
  cx = canvas.width/2; cy = canvas.height/2;
  Kinv = [1/fx,0,-cx/fx,  0,1/fy,-cy/fy,  0,0,1];
}

function setStatus(s){ statusEl.textContent = s; }

function resizeCanvas(){
  canvas.width = video.videoWidth || innerWidth;
  canvas.height = video.videoHeight || innerHeight;
  updateIntrinsics();
}
addEventListener('resize', resizeCanvas);

function matFromImage(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  return cv.imread(c);
}

// ---- small 3-vector / 3x3-matrix helpers (plain arrays, row-major) ----
function vlen(v){ return Math.hypot(v[0],v[1],v[2]); }
function vscale(v,s){ return [v[0]*s,v[1]*s,v[2]*s]; }
function vnorm(v){ const n=vlen(v)||1; return [v[0]/n,v[1]/n,v[2]/n]; }
function vsub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function vdot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function vcross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function vneg(v){ return [-v[0],-v[1],-v[2]]; }
function matMul3(A,B){
  const C=new Array(9);
  for(let r=0;r<3;r++) for(let c=0;c<3;c++){
    let s=0; for(let k=0;k<3;k++) s+=A[r*3+k]*B[k*3+c];
    C[r*3+c]=s;
  }
  return C;
}

// Recover an approximate camera pose (R,t) of the tracked plane from the
// 2D homography, the classic "pose from a planar homography" decomposition
// (same idea used by ArUco/marker-based AR when there's no separate
// calibration target). This is what lets us place content that stands
// *off* the plane instead of only ever being pasted flat onto it.
function decomposePose(Mmat){
  const h = Array.from(Mmat.data64F); // row-major 3x3: target-plane -> frame pixels
  const B = matMul3(Kinv, h);

  const b1=[B[0],B[3],B[6]], b2=[B[1],B[4],B[7]], b3=[B[2],B[5],B[8]];
  const n1=vlen(b1), n2=vlen(b2);
  if(n1 < 1e-9 || n2 < 1e-9) return null;
  const lambda = 2/(n1+n2);

  const b1s = vscale(b1,lambda);
  const b2s = vscale(b2,lambda);
  let t = vscale(b3,lambda);

  const r1n = vnorm(b1s);
  const r2ortho = vsub(b2s, vscale(r1n, vdot(r1n,b2s)));
  const r2n = vnorm(r2ortho);
  const r3n = vcross(r1n,r2n);

  let R1=r1n, R2=r2n;
  if(t[2] < 0){ R1=vneg(r1n); R2=vneg(r2n); t=vneg(t); } // keep the plane in front of the camera

  return { R: [R1[0],R2[0],r3n[0], R1[1],R2[1],r3n[1], R1[2],R2[2],r3n[2]], t };
}

function projectPoint(pose, p){
  const R=pose.R, t=pose.t;
  const X = R[0]*p[0]+R[1]*p[1]+R[2]*p[2]+t[0];
  const Y = R[3]*p[0]+R[4]*p[1]+R[5]*p[2]+t[1];
  const Z = R[6]*p[0]+R[7]*p[1]+R[8]*p[2]+t[2];
  const zz = Math.abs(Z) < 1e-6 ? 1e-6 : Z;
  return [fx*X/zz + cx, fy*Y/zz + cy];
}

function initTracker(){
  const target = matFromImage(targetImg);
  targetW = target.cols; targetH = target.rows;

  targetGray = new cv.Mat();
  cv.cvtColor(target,targetGray,cv.COLOR_RGBA2GRAY);

  orb = new cv.ORB(1000, 1.2, 10);
  targetKp = new cv.KeyPointVector();
  targetDesc = new cv.Mat();
  orb.detectAndCompute(targetGray, new cv.Mat(), targetKp, targetDesc);

  matcher = new cv.BFMatcher(cv.NORM_HAMMING, false);

  srcCornersMat = cv.matFromArray(4,1,cv.CV_32FC2, [
    0,0,  targetW,0,  targetW,targetH,  0,targetH
  ]);

  // Keep ar-content.jpg at its own native size/aspect ratio (no forced
  // resize into target.jpg's very different, very wide aspect ratio) —
  // that pre-squish was part of why the image looked soft.
  arFullMat = matFromImage(arImg);
  arCornersMat = cv.matFromArray(4,1,cv.CV_32FC2, [
    0,0,  arFullMat.cols,0,  arFullMat.cols,arFullMat.rows,  0,arFullMat.rows
  ]);

  billboardW = targetW * 0.9;
  billboardH = billboardW * (arFullMat.rows / arFullMat.cols);

  target.delete();
  setStatus(`追踪已准备：目标特征点 ${targetKp.size()} 个`);
}

async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });
    video.srcObject = stream;
    await video.play();
    resizeCanvas();
    running = true;
    startBtn.style.display='none';
    targetPreview.style.display='block';
    setStatus('正在寻找药盒…');
    requestAnimationFrame(loop);
  }catch(e){
    setStatus('无法打开摄像头');
    hintEl.textContent = '请在 HTTPS 页面中打开，并允许浏览器使用摄像头。';
    console.error(e);
  }
}

function verticalObjectCorners(){
  const cx0 = targetW/2, cy0 = targetH/2;
  const halfW = billboardW/2;
  const z = billboardH * BILLBOARD_UP;
  // Order matches arCornersMat: TL, TR, BR, BL
  return [
    [cx0-halfW, cy0, z],
    [cx0+halfW, cy0, z],
    [cx0+halfW, cy0, 0],
    [cx0-halfW, cy0, 0]
  ];
}

function processFrame(){
  if(video.readyState < 2) return;
  const W = canvas.width, Hh = canvas.height;
  const now = performance.now();

  // Work at a smaller resolution for phone performance.
  const workW = 640;
  const scale = workW / W;
  const workH = Math.max(1, Math.round(Hh * scale));

  const work = document.createElement('canvas');
  work.width=workW; work.height=workH;
  work.getContext('2d').drawImage(video,0,0,workW,workH);

  let frame = cv.imread(work);
  let gray = new cv.Mat();
  cv.cvtColor(frame,gray,cv.COLOR_RGBA2GRAY);

  let kp = new cv.KeyPointVector();
  let desc = new cv.Mat();
  orb.detectAndCompute(gray,new cv.Mat(),kp,desc);

  let inliers = 0;

  if(desc.rows > 0 && targetDesc.rows > 0){
    const knn = new cv.DMatchVectorVector();
    matcher.knnMatch(targetDesc,desc,knn,2);

    const good=[];
    for(let i=0;i<knn.size();i++){
      const m=knn.get(i);
      if(m.size()>=2){
        const a=m.get(0), b=m.get(1);
        if(a.distance < 0.75*b.distance) good.push(a);
      }
    }

    if(good.length >= 12){
      const srcPts=[], dstPts=[];
      for(const m of good){
        const p1=targetKp.get(m.queryIdx).pt;
        const p2=kp.get(m.trainIdx).pt;
        srcPts.push(p1.x,p1.y);
        dstPts.push(p2.x/scale,p2.y/scale);
      }

      const srcMat=cv.matFromArray(good.length,2,cv.CV_32F,srcPts);
      const dstMat=cv.matFromArray(good.length,2,cv.CV_32F,dstPts);
      const mask=new cv.Mat();
      const hom=cv.findHomography(srcMat,dstMat,cv.RANSAC,5,mask);

      if(!hom.empty()){
        for(let i=0;i<mask.rows;i++) if(mask.data[i]) inliers++;
        if(inliers>=10){
          const cornersOut = new cv.Mat();
          cv.perspectiveTransform(srcCornersMat, cornersOut, hom);
          const q = cornersOut.data32F;
          if(!smoothCorners){
            smoothCorners = Array.from(q);
          } else {
            for(let i=0;i<8;i++) smoothCorners[i] = SMOOTH*q[i] + (1-SMOOTH)*smoothCorners[i];
          }
          lastSeenAt = now;
          cornersOut.delete();
        }
      }
      srcMat.delete(); dstMat.delete(); mask.delete(); hom.delete();
    }
    knn.delete();
  }

  kp.delete(); desc.delete(); gray.delete(); frame.delete();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(smoothCorners){
    const sinceSeen = now - lastSeenAt;

    if(sinceSeen > HOLD_MS){
      smoothCorners = null;
      setStatus('正在寻找药盒…');
    } else {
      const dstCornersMat = cv.matFromArray(4,1,cv.CV_32FC2, smoothCorners);
      const M = cv.getPerspectiveTransform(srcCornersMat, dstCornersMat); // target plane -> frame

      let destQuad = smoothCorners; // flat-mode fallback / default

      if(DISPLAY_MODE === 'vertical'){
        const pose = decomposePose(M);
        if(pose){
          const proj = verticalObjectCorners().map(p=>projectPoint(pose,p));
          destQuad = [proj[0][0],proj[0][1], proj[1][0],proj[1][1], proj[2][0],proj[2][1], proj[3][0],proj[3][1]];
        }
      }

      const dstQuadMat = cv.matFromArray(4,1,cv.CV_32FC2, destQuad);
      const M2 = cv.getPerspectiveTransform(arCornersMat, dstQuadMat);
      const out = new cv.Mat();
      cv.warpPerspective(arFullMat, out, M2, new cv.Size(W,Hh), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(0,0,0,0));

      const tmp=document.createElement('canvas');
      tmp.width=W; tmp.height=Hh;
      cv.imshow(tmp, out);

      ctx.save();
      ctx.globalAlpha = 1; // 透明度关闭
      ctx.drawImage(tmp,0,0);
      ctx.restore();

      setStatus(sinceSeen < 50 ? `已识别药盒 · ${inliers} 个稳定匹配点` : '追踪中…');

      dstQuadMat.delete(); M2.delete(); out.delete();
      dstCornersMat.delete(); M.delete();
    }
  } else {
    setStatus('正在寻找药盒…');
  }
}

function loop(){
  if(!running) return;
  // Processing every frame now (previously every other) to cut the
  // perceived lag. If your phone struggles / overheats, reintroduce a
  // frameCount%2 skip like the previous version had.
  processFrame();
  requestAnimationFrame(loop);
}

function waitForCV(){
  if(typeof cv !== 'undefined' && cv.Mat){
    cv['onRuntimeInitialized']=()=>{
      initTracker();
      setStatus('视觉追踪引擎已加载');
    };
    setTimeout(()=>{
      if(!targetDesc) {
        try{ initTracker(); }catch(e){ console.error(e); }
      }
    },800);
  }else{
    setTimeout(waitForCV,300);
  }
}

startBtn.addEventListener('click',startCamera);
Promise.all([
  new Promise(r=>targetImg.onload=r),
  new Promise(r=>arImg.onload=r)
]).then(waitForCV);
</script>
</body>
</html>
