<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>药盒 WebAR 图片追踪 Demo</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  #camera,#overlay{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #camera{z-index:0;background:#111}
  #overlay{z-index:1;pointer-events:none}
  #ui{position:fixed;z-index:5;left:16px;right:16px;top:max(16px,env(safe-area-inset-top));color:#fff}
  .panel{background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-radius:16px;padding:12px 14px}
  #status{font-size:15px;font-weight:600}
  #hint{font-size:12px;opacity:.82;margin-top:5px;line-height:1.45}
  button{margin-top:10px;border:0;border-radius:999px;padding:10px 16px;background:#fff;color:#111;font-weight:700}
  #debug{position:fixed;z-index:6;bottom:max(12px,env(safe-area-inset-bottom));left:12px;color:#fff;background:rgba(0,0,0,.45);padding:7px 9px;border-radius:10px;font-size:11px;display:none}
  #targetPreview{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;width:92px;border-radius:10px;opacity:.8;border:1px solid rgba(255,255,255,.5);display:none}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<div id="ui">
  <div class="panel">
    <div id="status">正在加载视觉追踪引擎…</div>
    <div id="hint">允许摄像头后，把药盒顶部完整放进画面。这个版本先把图片“贴”到药盒顶面，移动/旋转药盒时图片会跟着变形。</div>
    <button id="start">启动摄像头</button>
  </div>
</div>
<div id="debug"></div>
<img id="targetPreview" src="target.jpg">

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const startBtn = document.getElementById('start');
const targetPreview = document.getElementById('targetPreview');

const targetImg = new Image();
const arImg = new Image();
targetImg.src = 'target.jpg';
arImg.src = 'ar-content.jpg';

let orb, targetGray, targetKp, targetDesc, matcher;
let arMat = null;          // AR content resized into target.jpg's own pixel space
let srcCornersMat = null;  // the 4 corners of target.jpg, in its own pixel space
let targetW = 0, targetH = 0;

let running = false;
let frameCount = 0;

// ---- stability state ----
// Instead of drawing a brand-new (and slightly different) homography every
// single frame, we smooth the 4 corner points of the tracked quad over
// time, and keep showing the last known pose for a short grace period if
// a frame briefly fails to match. That's what removes the flicker.
let smoothCorners = null;  // Float32Array/Array(8): x0,y0,x1,y1,x2,y2,x3,y3
let lastSeenAt = 0;
const HOLD_MS = 500;       // keep showing the last good pose for up to this long
const SMOOTH = 0.35;       // 0..1 — lower = smoother but laggier, higher = snappier but jitterier

function setStatus(s){ statusEl.textContent = s; }

function resizeCanvas(){
  canvas.width = video.videoWidth || innerWidth;
  canvas.height = video.videoHeight || innerHeight;
}
addEventListener('resize', resizeCanvas);

function matFromImage(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  return cv.imread(c);
}

function initTracker(){
  const target = matFromImage(targetImg);
  targetW = target.cols; targetH = target.rows;

  targetGray = new cv.Mat();
  cv.cvtColor(target,targetGray,cv.COLOR_RGBA2GRAY);

  orb = new cv.ORB(1000, 1.2, 10);
  targetKp = new cv.KeyPointVector();
  targetDesc = new cv.Mat();
  orb.detectAndCompute(targetGray, new cv.Mat(), targetKp, targetDesc);

  matcher = new cv.BFMatcher(cv.NORM_HAMMING, false);

  srcCornersMat = cv.matFromArray(4,1,cv.CV_32FC2, [
    0,0,  targetW,0,  targetW,targetH,  0,targetH
  ]);

  // IMPORTANT: the homography we compute lives in target.jpg's own pixel
  // space (0..targetW, 0..targetH). ar-content.jpg is a *different* size
  // (1200x900 vs target.jpg's 1152x340), so if we warp it with that
  // homography directly, warpPerspective samples the wrong region of it —
  // the overlay comes out cropped/misaligned, and that misalignment shifts
  // a little every frame as the pose changes, which reads as "flicker".
  // Resizing it once into target.jpg's coordinate space fixes that.
  const arRaw = matFromImage(arImg);
  arMat = new cv.Mat();
  cv.resize(arRaw, arMat, new cv.Size(targetW, targetH));
  arRaw.delete();

  target.delete();
  setStatus(`追踪已准备：目标特征点 ${targetKp.size()} 个`);
}

async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });
    video.srcObject = stream;
    await video.play();
    resizeCanvas();
    running = true;
    startBtn.style.display='none';
    targetPreview.style.display='block';
    setStatus('正在寻找药盒…');
    requestAnimationFrame(loop);
  }catch(e){
    setStatus('无法打开摄像头');
    hintEl.textContent = '请在 HTTPS 页面中打开，并允许浏览器使用摄像头。';
    console.error(e);
  }
}

function processFrame(){
  if(video.readyState < 2) return;
  const W = canvas.width, Hh = canvas.height;
  const now = performance.now();

  // Work at a smaller resolution for phone performance.
  const workW = 640;
  const scale = workW / W;
  const workH = Math.max(1, Math.round(Hh * scale));

  const work = document.createElement('canvas');
  work.width=workW; work.height=workH;
  work.getContext('2d').drawImage(video,0,0,workW,workH);

  let frame = cv.imread(work);
  let gray = new cv.Mat();
  cv.cvtColor(frame,gray,cv.COLOR_RGBA2GRAY);

  let kp = new cv.KeyPointVector();
  let desc = new cv.Mat();
  orb.detectAndCompute(gray,new cv.Mat(),kp,desc);

  let inliers = 0;

  if(desc.rows > 0 && targetDesc.rows > 0){
    const knn = new cv.DMatchVectorVector();
    matcher.knnMatch(targetDesc,desc,knn,2);

    const good=[];
    for(let i=0;i<knn.size();i++){
      const m=knn.get(i);
      if(m.size()>=2){
        const a=m.get(0), b=m.get(1);
        if(a.distance < 0.75*b.distance) good.push(a);
      }
    }

    if(good.length >= 12){
      const srcPts=[], dstPts=[];
      for(const m of good){
        const p1=targetKp.get(m.queryIdx).pt;
        const p2=kp.get(m.trainIdx).pt;
        srcPts.push(p1.x,p1.y);
        dstPts.push(p2.x/scale,p2.y/scale);
      }

      const srcMat=cv.matFromArray(good.length,2,cv.CV_32F,srcPts);
      const dstMat=cv.matFromArray(good.length,2,cv.CV_32F,dstPts);
      const mask=new cv.Mat();
      const hom=cv.findHomography(srcMat,dstMat,cv.RANSAC,5,mask);

      if(!hom.empty()){
        for(let i=0;i<mask.rows;i++) if(mask.data[i]) inliers++;
        if(inliers>=10){
          // Map the target's 4 corners through this frame's homography to
          // find out where the box currently sits, then blend that into
          // the running smoothed estimate instead of jumping straight to it.
          const cornersOut = new cv.Mat();
          cv.perspectiveTransform(srcCornersMat, cornersOut, hom);
          const q = cornersOut.data32F;
          if(!smoothCorners){
            smoothCorners = Array.from(q);
          } else {
            for(let i=0;i<8;i++) smoothCorners[i] = SMOOTH*q[i] + (1-SMOOTH)*smoothCorners[i];
          }
          lastSeenAt = now;
          cornersOut.delete();
        }
      }
      srcMat.delete(); dstMat.delete(); mask.delete(); hom.delete();
    }
    knn.delete();
  }

  kp.delete(); desc.delete(); gray.delete(); frame.delete();

  // Only touch the canvas right before we redraw — never clear-and-leave-
  // blank on frames where detection is skipped or briefly fails. That was
  // the main source of the on/off blinking.
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(smoothCorners){
    const sinceSeen = now - lastSeenAt;

    if(sinceSeen > HOLD_MS){
      // Lost it for too long — stop showing a stale, no-longer-true pose.
      smoothCorners = null;
      setStatus('正在寻找药盒…');
    } else {
      const dstCornersMat = cv.matFromArray(4,1,cv.CV_32FC2, smoothCorners);
      const M = cv.getPerspectiveTransform(srcCornersMat, dstCornersMat);
      const out = new cv.Mat();
      cv.warpPerspective(arMat, out, M, new cv.Size(W,Hh), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(0,0,0,0));

      const tmp = document.createElement('canvas');
      tmp.width=W; tmp.height=Hh;
      cv.imshow(tmp, out);

      // Fade out gently instead of popping off if we're coasting on a held pose.
      const alpha = 0.86 * (1 - Math.max(0, sinceSeen-50)/HOLD_MS);
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.drawImage(tmp,0,0);
      ctx.restore();

      setStatus(sinceSeen < 50 ? `已识别药盒 · ${inliers} 个稳定匹配点` : '追踪中…');

      dstCornersMat.delete(); M.delete(); out.delete();
    }
  } else {
    setStatus('正在寻找药盒…');
  }
}

function loop(){
  if(!running) return;
  frameCount++;
  // Limit heavy detection to roughly every other frame for phone
  // performance. The canvas is only cleared/redrawn inside processFrame
  // itself, so the overlay stays put on the frames in between instead of
  // blinking out.
  if(frameCount%2===0) processFrame();
  requestAnimationFrame(loop);
}

function waitForCV(){
  if(typeof cv !== 'undefined' && cv.Mat){
    cv['onRuntimeInitialized']=()=>{
      initTracker();
      setStatus('视觉追踪引擎已加载');
    };
    // Some builds are already initialized.
    setTimeout(()=>{
      if(!targetDesc) {
        try{ initTracker(); }catch(e){ console.error(e); }
      }
    },800);
  }else{
    setTimeout(waitForCV,300);
  }
}

startBtn.addEventListener('click',startCamera);
Promise.all([
  new Promise(r=>targetImg.onload=r),
  new Promise(r=>arImg.onload=r)
]).then(waitForCV);
</script>
</body>
</html>
